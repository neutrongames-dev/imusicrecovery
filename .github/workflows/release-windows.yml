name: Release Windows Desktop

# Publishing a release is what turns a green CI run into something users can
# download from the website. Tag a version and this attaches the installer,
# the portable build, and a checksum file to a GitHub Release.
#
#   git tag v1.0.0
#   git push origin v1.0.0

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-libimobiledevice
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Build and stage read-only Apple runtime
        shell: msys2 {0}
        run: ./scripts/stage-msys2-runtime.sh

      - name: Verify native runtime
        run: node scripts/verify-native-runtime.mjs

      - name: Verify desktop application
        run: npm run verify

      - name: Package Windows installer and portable build
        run: npm run dist:win
        env:
          # No signing certificate configured yet. Users will see a SmartScreen
          # warning until one is added; see BUILD_WINDOWS.md.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Generate checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem release -Filter *.exe
          if (-not $files) { throw "No installer was produced." }
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($f.Name)"
          }
          $lines | Set-Content release/SHA256SUMS.txt -Encoding ascii
          Get-Content release/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.blockmap
            release/SHA256SUMS.txt
          body: |
            ## Verify your download

            This build is not code-signed yet, so Windows SmartScreen will warn
            you the first time you run it. Check the download against the
            published checksum before installing:

            ```powershell
            Get-FileHash .\iMusicRecovery-Setup-*-x64.exe -Algorithm SHA256
            ```

            Compare the result with `SHA256SUMS.txt` below.

            ## Requirements

            - Windows 10 or 11, 64-bit
            - Apple Mobile Device Support installed (the Windows device driver,
              not iTunes). The app checks for this and tells you if it is missing.

            ## Safety

            The app only ever reads from the iPod. Every AFC write, delete,
            rename and non-read-only open is blocked by a CI check that fails
            the build if any appears in the native source.
